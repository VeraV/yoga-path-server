# Development Profile - Local PostgreSQL

# Database (hardcoded for local development)
spring.datasource.url=jdbc:postgresql://localhost:5432/yoga_path
spring.datasource.username=vera
spring.datasource.password=

# JPA / Hibernate (relaxed settings for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator (show full details in dev)
management.endpoint.health.show-details=always
